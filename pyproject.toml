[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scattersim"
version = "0.1.0"
description = "Kinematic scattering simulation from supercell structures"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "types-tqdm"]
ase = ["ase"]
tqdm = ["tqdm"]

[tool.setuptools.packages.find]
include = ["scattersim*"]

[tool.setuptools.package-data]
scattersim = ["data/*.json"]

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "ase.*"
ignore_missing_imports = true
